<title>Планер Ма</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar (категории, проекты, входящие) | main (заголовок, ассистент, календарь).
   Неделя всегда горизонтально: 7 колонок на Mac, горизонтальная лента на iPhone. День вертикально.
   Один светлый образ: тёплый белый + мягкие цветные пятна за матовым стеклом. */
:root{
  color-scheme: light;
  --bg:#F1F0EE;          /* ровный тёплый светло-серый с референса */
  --ink:#23262D;
  --muted:#7E828C;
  --faint:#AEB2BA;
  --line:rgba(35,38,45,.07);
  --work:  64,140,255;
  --home:  150,212,40;   /* салатовый */
  --hobby: 150,110,245;  /* фиолетовый */
  --insta: 255,112,172;  /* розовый */
  --due:   255,204,40;   /* птенчиково-жёлтый: дедлайны */
  --font-ui:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --blur:blur(26px) saturate(180%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid rgba(var(--work),.55);outline-offset:2px;border-radius:10px}

/* ---------- стекло ---------- */
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.66),rgba(255,255,255,.30));
  border:1px solid rgba(255,255,255,.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 10px 36px -14px rgba(50,60,100,.22);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.tint{
  --c:120,124,136;
  position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(165deg,rgba(var(--c),.34),rgba(var(--c),.20) 55%,rgba(var(--c),.26)),rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(var(--c),.18),0 6px 18px -8px rgba(var(--c),.45);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.tint::before{content:"";position:absolute;inset:0 0 52% 0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none;z-index:-1}
.c-work{--c:var(--work);--ct:30,95,200} .c-home{--c:var(--home);--ct:80,135,10} .c-hobby{--c:var(--hobby);--ct:105,65,210} .c-insta{--c:var(--insta);--ct:200,45,120} .c-due{--c:var(--due);--ct:165,115,0}
.dot.insta{background:rgb(var(--insta));box-shadow:0 0 0 4px rgba(var(--insta),.16),0 0 12px rgba(var(--insta),.5)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;max-width:1560px;margin:0 auto;padding-inline:24px;padding-block:20px 40px;min-height:100%}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;gap:22px;position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;padding:20px 14px;border-radius:28px;max-height:calc(100vh - 40px);overflow:auto}
.clock{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-radius:18px}
.clock .now{font-family:var(--font-num);font-size:26px;letter-spacing:-.04em;line-height:1}
.clock .since{font-size:12px;color:var(--muted)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 8px 8px;display:flex;justify-content:space-between}
.label .num{font-family:var(--font-num);letter-spacing:0}
.cats{display:flex;flex-direction:column;gap:4px}
.cat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;text-align:left;transition:background .2s,opacity .2s;font-weight:500}
.cat:hover{background:rgba(255,255,255,.5)}
.cat .dot{width:12px;height:12px;border-radius:50%;flex:none}
.cat .n{margin-left:auto;color:var(--muted);font-size:12px;font-family:var(--font-num)}
.cat.off{opacity:.35}
.dot.work{background:rgb(var(--work));box-shadow:0 0 0 4px rgba(var(--work),.16),0 0 12px rgba(var(--work),.5)}
.dot.home{background:rgb(var(--home));box-shadow:0 0 0 4px rgba(var(--home),.16),0 0 12px rgba(var(--home),.5)}
.dot.hobby{background:rgb(var(--hobby));box-shadow:0 0 0 4px rgba(var(--hobby),.16),0 0 12px rgba(var(--hobby),.5)}
.projects{display:flex;flex-direction:column;gap:2px}
.proj{display:flex;flex-direction:column;padding:8px 10px;border-radius:12px;text-align:left}
.proj:hover{background:rgba(255,255,255,.5)}
.proj.on{background:rgba(var(--work),.12)}
.proj .pn{font-weight:600}
.proj .pd{font-size:12px;color:var(--muted)}
.proj .pd.soon{color:rgb(200,45,120)}
.inbox{display:flex;flex-direction:column;gap:6px;min-height:64px;padding:8px;border-radius:16px;border:1px dashed rgba(35,38,45,.12);transition:background .2s,border-color .2s}
.inbox .empty-day{padding:6px 4px}
.switch{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;text-align:left;font-weight:500}
.switch .track{width:38px;height:23px;border-radius:12px;background:rgba(35,38,45,.12);position:relative;flex:none;transition:background .25s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .25s}
.switch[aria-pressed="true"] .track{background:rgba(var(--work),.75)}
.switch[aria-pressed="true"] .track::after{transform:translateX(15px)}
.switch small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.hint{font-size:12px;color:var(--muted);line-height:1.5;padding:0 8px;margin:0}
.hint button{color:rgb(var(--work));text-decoration:underline;text-underline-offset:2px}

/* ---------- header ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.when h1{font-weight:500;font-size:40px;line-height:1.05;margin:0;letter-spacing:-.025em;text-wrap:balance}
.when h1 b{font-weight:600}
.when .sub{color:var(--muted);margin-top:6px;font-size:13px}
.when h1 .nm{cursor:text;border-radius:10px}
.when h1 .nm:hover{background:rgba(255,255,255,.7)}
.when h1 input{font:inherit;letter-spacing:inherit;border:0;outline:none;background:rgba(255,255,255,.85);border-radius:12px;padding:0 10px;width:8em;max-width:60vw}
.when h1 .ask{font-size:15px;font-weight:600;color:rgb(30,90,200);vertical-align:middle;margin-left:8px}
.period{margin:4px 2px -4px;font-size:20px;font-weight:400;letter-spacing:-.02em}
.period b{font-weight:700}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:14px;gap:2px}
.seg button{padding:7px 14px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.12)}
.nav{display:inline-flex;align-items:center;padding:4px;border-radius:14px;gap:2px}
.icon-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:rgba(255,255,255,.8);color:var(--ink)}
.today-btn{padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
.today-btn:hover{background:rgba(255,255,255,.8);color:var(--ink)}
.add-btn{padding:10px 18px;border-radius:16px;font-weight:700;color:#2a2000}
.add-btn.tint,.fab.tint{background:linear-gradient(180deg,rgb(255,210,90),rgb(255,190,40));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 24px -10px rgba(255,170,20,.8)}
.inbox-btn{display:none}

/* ---------- ассистент ---------- */
.assist{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:20px}
.assist input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:8px 0;font-size:15px}
.assist input::placeholder{color:var(--faint)}
.mic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:rgb(110,70,220);flex:none}
.mic.live{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(var(--hobby),.15)}}
.send{height:40px;padding:0 16px;border-radius:14px;font-weight:600;color:rgb(30,90,200);flex:none}
.assist.busy input{background:linear-gradient(90deg,var(--muted) 0%,var(--faint) 50%,var(--muted) 100%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.assist-hint{font-size:12px;color:var(--muted);margin:-8px 16px 0}
.mobile-cats{display:none}
.banner{padding:10px 14px;border-radius:16px;font-size:13px;font-weight:500;color:rgb(25,75,165)}
.banner button{text-decoration:underline}

/* ---------- неделя ---------- */
.weekwrap{position:relative}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{display:flex;flex-direction:column;gap:8px;min-height:420px;padding:12px 8px 8px;border-radius:24px;transition:background .2s,box-shadow .2s}
.day.today{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.6));box-shadow:inset 0 1px 0 #fff,0 16px 40px -18px rgba(255,180,30,.55);border-color:rgba(255,196,52,.45)}
.day.past{opacity:.7}
.dh{display:flex;align-items:baseline;gap:8px;padding:0 6px 6px;cursor:pointer}
.dh{align-items:center!important}
.dh .dn{font-family:var(--font-num);font-size:16px;font-weight:500;line-height:1;letter-spacing:-.02em;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 4px 12px -6px rgba(60,50,40,.25);flex:none}
.dh .dw{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day.today .dh .dn{background:rgb(255,196,52);color:#2a2000;box-shadow:0 6px 16px -6px rgba(255,180,30,.7)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:14px;text-align:left;width:100%;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,opacity .2s}
.task:hover{transform:translateY(-1px)}
.task.dragging{opacity:.3}
.check{width:17px;height:17px;border-radius:50%;flex:none;margin-top:1px;border:1.5px solid rgba(var(--c),.7);background:rgba(255,255,255,.75);display:grid;place-items:center;cursor:pointer}
.task.done .check{background:rgb(var(--c));border-color:transparent}
.task.done .check::after{content:"";width:7px;height:3.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.tb{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.tt{font-size:13px;line-height:1.3;font-weight:500;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tm{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:rgba(35,38,45,.62);align-items:center}
.tm .time{font-family:var(--font-num);font-weight:500;color:rgb(var(--ct,var(--c)))}
.tm .sub{font-family:var(--font-num)}
.tag-due{color:rgb(165,115,0);font-weight:700}
.add-in{margin-top:auto;padding:8px;border-radius:12px;color:var(--faint);font-size:13px;font-weight:500;text-align:center;opacity:0;transition:opacity .2s,background .2s}
.day:hover .add-in,.add-in:focus-visible{opacity:1}
.add-in:hover{background:rgba(255,255,255,.6);color:var(--muted)}
.empty-day{color:var(--faint);font-size:12px;padding:4px 6px}
.drop-on{background:rgba(var(--work),.12)!important;box-shadow:inset 0 0 0 1.5px rgba(var(--work),.45)!important}

/* ---------- день ---------- */
.dayview{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.timeline{position:relative;border-radius:26px;padding:12px 12px 12px 64px}
.hour{height:56px;border-top:1px solid var(--line);position:relative}
.hour span{position:absolute;left:-52px;top:-8px;font-size:11px;color:var(--faint);width:42px;text-align:right;font-family:var(--font-num)}
.ev{position:absolute;padding:6px 10px;overflow:hidden;z-index:2}
.nowline{position:absolute;left:58px;right:10px;height:0;border-top:1.5px solid rgba(var(--insta),.9);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:rgb(var(--insta));box-shadow:0 0 10px rgba(var(--insta),.8)}
.droptime{position:absolute;left:58px;right:10px;border-top:2px dashed rgba(var(--work),.7);z-index:4;pointer-events:none}
.droptime span{position:absolute;left:-54px;top:-9px;font-family:var(--font-num);font-size:11px;color:rgb(var(--work));background:var(--bg);padding:0 3px;border-radius:4px}
.dayside{display:flex;flex-direction:column;gap:12px}
.panel{padding:14px;border-radius:22px}

/* ---------- месяц ---------- */
.mhead,.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead div{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 8px}
.mc{min-height:108px;padding:8px;border-radius:16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc:hover{background:rgba(255,255,255,.8)}
.mc.other{opacity:.4}
.mc.today{box-shadow:inset 0 0 0 2px rgba(255,196,52,.9)}
.mc .md{font-family:var(--font-num);font-size:15px;line-height:1}
.mc.today .md{color:rgb(165,115,0);font-weight:600}
.mp{font-size:11px;padding:2px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.more{font-size:11px;color:var(--muted);padding-left:4px}

/* ---------- Instagram ---------- */
.insta{display:flex;flex-direction:column;gap:14px}
.istrat{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.istrat .panel{display:flex;flex-direction:column;gap:8px}
.goal{border:0;background:transparent;outline:none;font-size:15px;font-weight:500;resize:none;width:100%;min-height:58px;line-height:1.4}
.meter{display:flex;align-items:baseline;gap:6px}
.meter b{font-family:var(--font-num);font-size:30px;font-weight:400;letter-spacing:-.04em}
.meter span{color:var(--muted)}
.bar{height:8px;border-radius:4px;background:rgba(35,38,45,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,rgba(var(--insta),.7),rgba(var(--hobby),.7))}
.stepper{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stepper button{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.7);font-weight:600}
.rubrics{display:flex;flex-wrap:wrap;gap:6px}
.rub{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.rub .x{opacity:.45}
.rub .x:hover{opacity:1}
.rubadd{border:0;background:transparent;outline:none;font-size:12px;padding:5px 4px;min-width:90px;flex:1}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:8px;padding:12px 8px 8px;border-radius:24px;min-height:360px}
.col h3{margin:0;padding:0 6px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.col h3 span{font-family:var(--font-num);letter-spacing:0}
.fmt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.7);color:rgb(200,45,120)}

/* ---------- редактор ---------- */
.scrim{position:fixed;inset:0;background:rgba(240,241,245,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:20;display:grid;place-items:center;padding:16px}
.sheet{width:min(480px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:rise .28s ease;background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.62))}
@keyframes rise{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-weight:300;font-size:26px;letter-spacing:-.02em}
.title-in{width:100%;border:0;border-bottom:1px solid var(--line);padding:6px 0 10px;font-size:18px;font-weight:500;background:transparent;outline:none}
.title-in:focus{border-bottom-color:rgba(var(--work),.5)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 130px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field .fl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);border-radius:12px;padding:9px 11px;width:100%;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.03)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(var(--work),.45)}
.field input:disabled{opacity:.4}
.field textarea{resize:vertical;min-height:56px}
.catpick{display:flex;gap:8px;flex-wrap:wrap}
.catpick button{padding:8px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:.5;transition:opacity .2s}
.catpick button[aria-pressed="true"]{opacity:1}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-align:left;font-weight:500;flex:1 1 160px}
.chk .box{width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(var(--c),.7);display:grid;place-items:center;background:#fff;flex:none}
.chk[aria-pressed="true"] .box{background:rgb(var(--c));border-color:transparent}
.chk[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.subs{display:flex;flex-direction:column;gap:4px}
.subrow{display:flex;align-items:center;gap:10px;padding:4px 2px}
.subrow .sbox{width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(var(--work),.6);flex:none;display:grid;place-items:center;background:#fff}
.subrow .sbox[aria-checked="true"]{background:rgb(var(--work));border-color:transparent}
.subrow .sbox[aria-checked="true"]::after{content:"";width:7px;height:3.5px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.subrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.subrow.done span{text-decoration:line-through;color:var(--muted)}
.subrow .x{color:var(--faint);width:24px;height:24px;border-radius:8px}
.subrow .x:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.subadd{border:0!important;background:transparent!important;box-shadow:none!important;padding:6px 2px!important;border-bottom:1px dashed var(--line)!important;border-radius:0!important}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;font-weight:600}
.btn.ghost{color:var(--muted)}
.btn.ghost:hover{background:rgba(0,0,0,.04)}
.btn.danger{color:rgb(200,70,60)}
.btn.primary{color:rgb(30,90,200)}

/* ---------- уведомления ---------- */
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:30;max-width:calc(100% - 40px)}
.toast{padding:12px 16px;border-radius:18px;min-width:260px;animation:rise .3s ease;display:flex;gap:12px;align-items:center}
.toast .tx{flex:1;min-width:0}
.toast b{display:block;font-weight:600}
.toast span{font-size:12px;color:var(--muted)}
.toast button{font-weight:600;color:rgb(30,90,200);padding:6px 8px;border-radius:8px}

  <main class="main">

          <button class="today-btn" id="todayBtn">Сегодня</button>
          <button class="icon-btn" id="next" aria-label="Вперёд"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="clock glass" id="clock"><span class="now" id="clockNow"></span><span class="since" id="clockSince"></span></div>
        <div class="seg glass" id="viewSeg">
          <button data-v="day">День</button><button data-v="week">Неделя</button><button data-v="month">Месяц</button><button data-v="insta">Instagram</button>

<script>
(function(){
const CATS={work:{name:"Работа",cls:"c-work"},home:{name:"Дом",cls:"c-home"},hobby:{name:"Хобби",cls:"c-hobby"},insta:{name:"Instagram",cls:"c-insta"}};
const STAGES=[["idea","Идеи"],["script","Сценарий"],["shoot","Съёмка"],["edit","Монтаж"],["ready","Готово"],["posted","Опубликовано"]];
const FORMATS=["Reels","Карусель","Пост","Сторис"];
const REPEAT={none:"Не повторять",daily:"Каждый день",weekdays:"По будням",weekly:"Каждую неделю",monthly:"Каждый месяц"};
const WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WDF=["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_N=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const LKEY="ma-planner-v2";
const H0=7,H1=24,PX=56;

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mins=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const plural=(n,f)=>{const a=n%10,b=n%100;return f[a===1&&b!==11?0:a>=2&&a<=4&&(b<10||b>=20)?1:2]};

/* ================= хранилище =================
   В приложении Claude задачи живут в базе артефакта (синхронизация Mac ↔ iPhone).
   Вне его — в этом браузере. */
const Store={
  mode:"local",tasks:[],projects:[],insta:{goal:"",perWeek:3,rubrics:[]},db:null,tCol:null,pCol:null,metaDoc:null,
  loadLocal(){try{const j=JSON.parse(localStorage.getItem(LKEY)||"null");if(j){this.tasks=j.tasks||[];this.projects=j.projects||[];if(j.insta)this.insta=j.insta}}catch(e){}},
  saveLocal(){if(this.mode!=="local")return;try{localStorage.setItem(LKEY,JSON.stringify({tasks:this.tasks,projects:this.projects,insta:this.insta}))}catch(e){}},
  async init(){
    this.loadLocal();
    try{
      const c=window.claude;
      const [db,user]=c?await Promise.all([c.use("db"),c.use("user")]):[null,null];
      let uidv=null;
      if(user){const me=await user.me();this.profileName=(me.name||"").trim().split(/\s+/)[0]||"";this.isOwner=me.isOwner;uidv=me.id}
      if(!db||!uidv){renderHello();return}
      this.db=db;this.mode="db";
      // У каждого человека свой планер: личная папка, которую видит только он сам
      const base=db.doc("data/users/"+uidv+"/planner");
      this.profDoc=base;
      base.onSnapshot(s=>{this.myName=s.exists?(s.data().name||""):"";renderHello()},()=>{});
      await this.migrate(db,base);
      this.tCol=base.collection("tasks");this.pCol=base.collection("projects");
      this.tasks=[];this.projects=[];
      this.tCol.onSnapshot(s=>{this.tasks=s.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{});
      this.pCol.onSnapshot(s=>{this.projects=s.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{});
      this.metaDoc=base.collection("meta").doc("insta");
      this.metaDoc.onSnapshot(s=>{if(s.exists){this.insta={goal:"",perWeek:3,rubrics:[],...s.data()};if(!metaEditing)render()}},()=>{});
    }catch(e){this.mode="local"}
  },
  async migrate(db,base){
    // разовый перенос задач из первой версии планера (общая папка) в личную
    try{
      if(!this.isOwner)return;
      const mine=await base.collection("tasks").limit(1).get();
      if(!mine.empty)return;
      const old=db.doc("planner/main");
      const [t,p,m]=await Promise.all([old.collection("tasks").get(),old.collection("projects").get(),old.collection("meta").doc("insta").get()]);
      for(const d of p.docs)await base.collection("projects").doc(d.id).set(d.data());
      for(const d of t.docs)await base.collection("tasks").doc(d.id).set(d.data());
      if(m.exists)await base.collection("meta").doc("insta").set(m.data());
    }catch(e){}
  },
  setName(n){
    this.myName=n;
    if(this.mode==="db")this.profDoc.set({name:n}).catch(()=>{});
    else try{localStorage.setItem(LKEY+"-name",n)}catch(e){}
  },
  displayName(){
    if(this.myName)return this.myName;
    if(this.mode!=="db"){try{return localStorage.getItem(LKEY+"-name")||this.profileName||""}catch(e){}}
    return this.profileName||"";
  },
  clean(o){const r={};for(const k in o){if(o[k]!==undefined&&k!=="id")r[k]=o[k]}return r},
  putTask(t){
    const i=this.tasks.findIndex(x=>x.id===t.id);if(i<0)this.tasks.push(t);else this.tasks[i]=t;
    if(this.mode==="db")this.tCol.doc(t.id).set(this.clean(t)).catch(err=>toast("Не удалось сохранить",err.code==="quota_exceeded"?"Хранилище заполнено":"Проверьте соединение"));
    else this.saveLocal();
  },
  delTask(id){
    this.tasks=this.tasks.filter(x=>x.id!==id);
    if(this.mode==="db")this.tCol.doc(id).delete().catch(()=>{});else this.saveLocal();
  },
  putInsta(patch){
    this.insta={...this.insta,...patch};
    if(this.mode==="db")this.metaDoc.set(this.insta).catch(()=>{});else this.saveLocal();
  },
  putProject(p){
    this.projects.push(p);
    if(this.mode==="db")this.pCol.doc(p.id).set(this.clean(p)).catch(()=>{});else this.saveLocal();
  }
};

/* ================= состояние ================= */
let metaEditing=false;
const S={view:"week",cursor:iso(new Date()),off:{},team:false,activeProject:null,inboxOpen:false};
try{const v=localStorage.getItem(LKEY+"-view");if(v)S.view=v}catch(e){}

const isRepeat=t=>t.repeat&&t.repeat!=="none";
function occursOn(t,k){
  if(!t.date)return false;
  if(!isRepeat(t))return t.date===k;
  if(k<t.date)return false;
  const d=parse(k),s=parse(t.date);
  switch(t.repeat){
    case"daily":return true;
    case"weekdays":return d.getDay()>=1&&d.getDay()<=5;
    case"weekly":return d.getDay()===s.getDay();
    case"monthly":return d.getDate()===s.getDate();
  }return false;
}
const isDone=(t,k)=>isRepeat(t)?(t.doneDates||[]).includes(k):!!t.done;
const visible=t=>{
  if(S.team&&t.cat!=="work")return false;
  if(S.off[t.cat])return false;
  if(S.activeProject&&t.project!==S.activeProject)return false;
  return true;
};
const byTime=a=>a.slice().sort((x,y)=>{const mx=mins(x.time),my=mins(y.time);
  if(mx==null&&my==null)return(x.created||0)-(y.created||0);if(mx==null)return 1;if(my==null)return-1;return mx-my});
const tasksOn=k=>byTime(Store.tasks.filter(t=>occursOn(t,k)&&visible(t)));
const inboxTasks=()=>Store.tasks.filter(t=>!t.date&&t.cat!=="insta"&&visible(t)).sort((a,b)=>(a.created||0)-(b.created||0));
const projName=id=>{const p=Store.projects.find(p=>p.id===id);return p?p.name:""};

/* ================= карточка задачи ================= */
function chip(t,k,extraCls="",style=""){
  const meta=[];
  if(t.time){const e=mins(t.time)+(t.dur||60);meta.push(`<span class="time">${t.time}${extraCls?"–"+hhmm(e):""}</span>`)}
  if(t.cat==="insta"&&t.format)meta.push(`<span class="fmt">${esc(t.format)}</span>`);
  if(t.cat==="insta"&&t.rubric)meta.push(`<span>${esc(t.rubric)}</span>`);
  if(t.project)meta.push(`<span>${esc(projName(t.project))}</span>`);
  if(t.subs&&t.subs.length)meta.push(`<span class="sub">${t.subs.filter(s=>s.done).length}/${t.subs.length}</span>`);
  if(isRepeat(t))meta.push(`<span title="${REPEAT[t.repeat]}">↻</span>`);
  if(t.deadline)meta.push(`<span class="tag-due">дедлайн</span>`);
  if(t.remind!=null)meta.push(`<span title="Напоминание">🔔</span>`);
  const done=isDone(t,k||"");
  return `<div class="task tint ${CATS[t.cat]?.cls||""} ${done?"done":""} ${extraCls}" data-id="${t.id}" data-date="${k||""}" data-drag role="button" tabindex="0" style="${style}">
    <span class="check" data-toggle="${t.id}" data-date="${k||""}" role="checkbox" aria-checked="${done}" aria-label="Готово"></span>
    <span class="tb"><span class="tt">${esc(t.title)}</span>${meta.length?`<span class="tm">${meta.join("")}</span>`:""}</span></div>`;
}

/* ================= боковая панель ================= */
function renderSide(){
  const todayIso=iso(new Date());
  const wk=monday(parse(S.cursor));const days=[...Array(7)].map((_,i)=>iso(addDays(wk,i)));
  const counts={work:0,home:0,hobby:0,insta:0};
  Store.tasks.forEach(t=>days.forEach(k=>{if(occursOn(t,k)&&!isDone(t,k)&&counts[t.cat]!=null)counts[t.cat]++}));
  const catBtns=Object.entries(CATS).filter(([k])=>!S.team||k==="work").map(([k,c])=>
    `<button class="cat ${S.off[k]?"off":""}" data-cat="${k}" aria-pressed="${!S.off[k]}"><span class="dot ${k}"></span>${c.name}<span class="n">${counts[k]}</span></button>`).join("");
  const projs=Store.projects.map(p=>{
    const dl=Store.tasks.filter(t=>t.project===p.id&&t.deadline&&!t.done&&t.date&&t.date>=todayIso).sort((a,b)=>a.date.localeCompare(b.date))[0];
    let txt="без дедлайна",soon=false;
    if(dl){const diff=Math.round((parse(dl.date)-parse(todayIso))/864e5);soon=diff<=3;
      txt="дедлайн "+(diff===0?"сегодня":diff===1?"завтра":parse(dl.date).getDate()+" "+MONTHS[parse(dl.date).getMonth()]);}
    return `<button class="proj ${S.activeProject===p.id?"on":""}" data-proj="${p.id}"><span class="pn">${esc(p.name)}</span><span class="pd ${soon?"soon":""}">${txt}</span></button>`;
  }).join("")||'<p class="hint">Проекты появятся, когда вы создадите рабочую задачу с проектом.</p>';
  const inbox=inboxTasks();
  const hasEx=Store.tasks.some(t=>t.example);
  document.getElementById("side").innerHTML=`

    <div><div class="label">Входящие <span class="num">${inbox.length||""}</span></div>
      <div class="inbox" data-drop="inbox">${inbox.map(t=>chip(t,"")).join("")||'<div class="empty-day">Идеи без даты. Перетащите задачу на день, когда будет ясно.</div>'}</div></div>
    <div><div class="label">Категории</div><div class="cats">${catBtns}</div></div>
    <div><div class="label">Рабочие проекты</div><div class="projects">${projs}</div></div>
    <div><div class="label">Доступ</div>
      <button class="switch" data-team aria-pressed="${S.team}"><span class="track"></span><span>Вид для команды<small>только рабочие задачи</small></span></button></div>
    <p class="hint">${Store.mode==="db"?"Это ваш личный планер: его видите только вы, на Mac и iPhone.":"Задачи хранятся в этом браузере."}${hasEx?` Примеры можно <button data-clear-ex>убрать</button>.`:""}</p>`;
  document.getElementById("mcats").innerHTML=catBtns+`<button class="cat" data-team style="${S.team?"background:rgba(var(--work),.15)":""}">${S.team?"Вид команды ✓":"Вид для команды"}</button>`;
  document.getElementById("inboxN").textContent=inbox.length||"";
  document.getElementById("mInbox").innerHTML=S.inboxOpen?`<div class="panel glass" style="margin-bottom:4px"><div class="label">Входящие</div>
    <div class="inbox" data-drop="inbox">${inbox.map(t=>chip(t,"")).join("")||'<div class="empty-day">Пусто. Задачи без даты попадают сюда.</div>'}</div>
    <p class="hint" style="margin-top:8px">Удерживайте задачу и перетащите её на день.</p></div>`:"";
}

/* ================= виды ================= */
function setTitle(h){document.getElementById("title").innerHTML=h}
function renderWeek(){
  const m=monday(parse(S.cursor)),end=addDays(m,6),today=iso(new Date());
  setTitle(m.getMonth()===end.getMonth()?`<b>${m.getDate()}–${end.getDate()}</b> ${MONTHS[m.getMonth()]}`
    :`<b>${m.getDate()}</b> ${MONTHS[m.getMonth()].slice(0,3)} – <b>${end.getDate()}</b> ${MONTHS[end.getMonth()].slice(0,3)}`);
  let html='<div class="week" id="weekScroller">';
  for(let i=0;i<7;i++){
    const d=addDays(m,i),k=iso(d),list=tasksOn(k);
    html+=`<section class="day glass ${k===today?"today":""} ${k<today?"past":""}" data-drop="date:${k}" data-k="${k}">
      <div class="dh" data-goday="${k}"><span class="dn">${pad(d.getDate())}</span><span class="dw">${WD[i]}${k===today?" · сегодня":""}</span></div>
      <div class="tasks">${list.map(t=>chip(t,k)).join("")||'<div class="empty-day">Свободно</div>'}</div>
      <button class="add-in" data-add="${k}">+ добавить</button></section>`;
  }
  return html+"</div>";
}
function renderDay(){
  const d=parse(S.cursor),k=S.cursor,today=iso(new Date());
  setTitle(`<b>${d.getDate()} ${MONTHS[d.getMonth()]}</b>, ${WDF[(d.getDay()+6)%7]}`);
  const list=tasksOn(k),timed=list.filter(t=>t.time),untimed=list.filter(t=>!t.time);
  let hours="";for(let h=H0;h<H1;h++)hours+=`<div class="hour"><span>${pad(h)}:00</span></div>`;
  const lanes=[];
  const placed=timed.map(t=>{const s=Math.max(mins(t.time),H0*60),e=s+(t.dur||60);let li=lanes.findIndex(x=>x<=s);if(li<0){li=lanes.length;lanes.push(e)}else lanes[li]=e;return{t,s,e,li}});
  const nL=Math.max(1,lanes.length);
  const evs=placed.map(({t,s,e,li})=>{
    const top=12+(s-H0*60)/60*PX,h=Math.max(32,(e-s)/60*PX-4);
    return chip(t,k,"ev",`top:${top}px;height:${h}px;left:calc(64px + (100% - 76px) * ${li}/${nL});width:calc((100% - 76px)/${nL} - 4px)`);
  }).join("");
  let now="";
  if(k===today){const n=new Date(),nm=n.getHours()*60+n.getMinutes();if(nm>=H0*60)now=`<div class="nowline" style="top:${12+(nm-H0*60)/60*PX}px"></div>`;}
  const dues=Store.tasks.filter(t=>t.deadline&&!t.done&&t.date&&t.date>=today&&visible(t)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  return `<div class="dayview">
    <div class="timeline glass" data-drop="time:${k}" id="timeline">${hours}${evs}${now}</div>
    <div class="dayside">
      <div class="panel glass" data-drop="date:${k}"><div class="label">Без времени</div><div class="tasks">${untimed.map(t=>chip(t,k)).join("")||'<div class="empty-day">Ничего</div>'}</div></div>
      <div class="panel glass"><div class="label">Ближайшие дедлайны</div><div class="tasks">${dues.map(t=>chip(t,t.date)).join("")||'<div class="empty-day">Спокойно</div>'}</div></div>
      <button class="add-btn tint c-due" data-add="${k}">+ Задача на этот день</button>
    </div></div>`;
}
function renderMonth(){
  const c=parse(S.cursor),first=new Date(c.getFullYear(),c.getMonth(),1),start=monday(first),today=iso(new Date());
  setTitle(`<b>${MONTHS_N[c.getMonth()]}</b> ${c.getFullYear()}`);
  const weeks=Math.ceil(((first.getDay()+6)%7+new Date(c.getFullYear(),c.getMonth()+1,0).getDate())/7);
  let html=`<div class="mhead">${WD.map(w=>`<div>${w}</div>`).join("")}</div><div class="month">`;
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),k=iso(d),list=tasksOn(k);

}

function toast(title,sub,action){

  el.innerHTML=`<div class="tx"><b>${esc(title)}</b><span>${esc(sub)}</span></div>${action?`<button>${esc(action.label)}</button>`:""}`;

const fired=new Set();
function checkReminders(){
  const now=Date.now(),today=new Date();
  [iso(today),iso(addDays(today,1))].forEach(k=>{
    Store.tasks.forEach(t=>{
      if(t.remind==null||!t.time||!occursOn(t,k)||isDone(t,k))return;
      const key=t.id+k;if(fired.has(key))return;
      const start=parse(k);const m=mins(t.time);start.setHours(Math.floor(m/60),m%60,0,0);
      const at=start.getTime()-t.remind*60000;
      if(now>=at&&now<start.getTime()+5*60000){
        fired.add(key);
        toast(t.title,t.remind===0?"Начинается сейчас":`${t.remind>=1440?"Завтра":"Через "+(t.remind>=60?t.remind/60+" ч":t.remind+" мин")} · ${t.time}`);
      }
    });
  });
}

/* ================= перетаскивание ================= */
let drag=null,suppressClick=false;
function startDrag(){
  if(!drag)return;drag.started=true;
  const r=drag.el.getBoundingClientRect();
  const g=drag.el.cloneNode(true);g.classList.add("ghost-drag");g.classList.remove("ev");
  g.style.cssText=`width:${Math.min(r.width,260)}px;left:${r.left}px;top:${r.top}px`;
  document.body.appendChild(g);drag.ghost=g;drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
  drag.el.classList.add("dragging");
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
}
function dropTarget(x,y){
  const el=document.elementFromPoint(x,y);
  return el?el.closest("[data-drop]"):null;
}
function timeFromY(tl,y,dy){
  const r=tl.getBoundingClientRect();
  let m=H0*60+Math.round(((y-r.top-12-(dy||0)+4)/PX*60)/15)*15;
  return Math.max(H0*60,Math.min((H1*60)-15,m));
}
document.addEventListener("pointerdown",e=>{
  if(e.button>0)return;
  const el=e.target.closest("[data-drag]");
  if(!el||e.target.closest("[data-toggle]"))return;
  drag={el,id:el.dataset.id,from:el.dataset.date,x:e.clientX,y:e.clientY,started:false,touch:e.pointerType!=="mouse"};
  if(drag.touch)drag.timer=setTimeout(startDrag,320);
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(!drag.started){
    if(!drag.touch&&dist>6)startDrag();
    else if(drag.touch&&dist>10){clearTimeout(drag.timer);drag=null;return}
    if(!drag||!drag.started)return;
  }
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.dx)+"px";drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  document.querySelectorAll(".drop-on").forEach(n=>n.classList.remove("drop-on"));
  document.querySelector(".droptime")?.remove();
  const tg=dropTarget(e.clientX,e.clientY);
  if(tg){
    if(tg.dataset.drop.startsWith("time:")){
      const m=timeFromY(tg,e.clientY,drag.dy);
      const line=document.createElement("div");line.className="droptime";line.style.top=(12+(m-H0*60)/60*PX)+"px";line.innerHTML=`<span>${hhmm(m)}</span>`;tg.appendChild(line);
    }else tg.classList.add("drop-on");
  }
  const sc=document.getElementById("weekScroller");
  if(sc&&sc.scrollWidth>sc.clientWidth){const r=sc.getBoundingClientRect();
    if(e.clientX<r.left+40)sc.scrollLeft-=12;else if(e.clientX>r.right-40)sc.scrollLeft+=12;}
},{passive:false});
document.addEventListener("touchmove",e=>{if(drag&&drag.started)e.preventDefault()},{passive:false});
function endDrag(e,cancel){
  if(!drag)return;clearTimeout(drag.timer);
  const d=drag;drag=null;
  if(!d.started)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,50);
  d.ghost.remove();d.el.classList.remove("dragging");
  document.querySelectorAll(".drop-on").forEach(n=>n.classList.remove("drop-on"));
  if(cancel){render();return}
  const tg=dropTarget(e.clientX,e.clientY);
  const t=Store.tasks.find(x=>x.id===d.id);
  if(!tg||!t){render();return}
  const nt={...t};const spec=tg.dataset.drop;
  const moveTo=k=>{
    if(isRepeat(t)&&d.from&&t.date){const delta=Math.round((parse(k)-parse(d.from))/864e5);nt.date=iso(addDays(parse(t.date),delta))}
    else nt.date=k;
  };
  if(spec.startsWith("status:")){nt.status=spec.slice(7);nt.done=nt.status==="posted";Store.putTask(nt);render();return}
  if(spec==="inbox"){nt.date="";nt.time="";nt.repeat="none"}
  else if(spec.startsWith("date:"))moveTo(spec.slice(5));
  else if(spec.startsWith("time:")){moveTo(spec.slice(5));nt.time=hhmm(timeFromY(tg,e.clientY,d.dy));}
  Store.putTask(nt);render();
  if(spec!=="inbox"){const k=spec.slice(5);const dd=parse(k);toast("Перенесено",`${esc(t.title)} → ${dd.getDate()} ${MONTHS[dd.getMonth()]}${nt.time?", "+nt.time:""}`,{label:"Отменить",run:()=>{Store.putTask(t);render()}})}
}
document.addEventListener("pointerup",e=>endDrag(e,false));
document.addEventListener("pointercancel",e=>endDrag(e,true));
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-drag]"))e.preventDefault()});

/* ================= клики ================= */
document.addEventListener("click",e=>{
  if(suppressClick){e.stopPropagation();e.preventDefault();return}
  const tg=e.target.closest("[data-toggle]");
  if(tg){e.stopPropagation();const t=Store.tasks.find(x=>x.id===tg.dataset.toggle);if(!t)return;const nt={...t};const k=tg.dataset.date;
    if(isRepeat(t)){const s=new Set(t.doneDates||[]);s.has(k)?s.delete(k):s.add(k);nt.doneDates=[...s]}else nt.done=!t.done;
    if(t.cat==="insta")nt.status=nt.done?"posted":(t.status==="posted"?"ready":t.status);
    Store.putTask(nt);render();return}
  const task=e.target.closest(".task[data-id]");
  if(task&&!task.closest(".ghost-drag")){openEditor(Store.tasks.find(x=>x.id===task.dataset.id));return}
  const add=e.target.closest("[data-add]");if(add){openEditor(null,add.dataset.add);return}
  const ai=e.target.closest("[data-add-insta]");if(ai){openEditor(null,"",{cat:"insta",status:ai.dataset.addInsta,format:"Reels"});return}
  const per=e.target.closest("[data-per]");if(per){Store.putInsta({perWeek:Math.max(1,Math.min(21,(Store.insta.perWeek||3)+ +per.dataset.per))});render();return}
  const rx=e.target.closest("[data-rubx]");if(rx){const r=[...(Store.insta.rubrics||[])];r.splice(+rx.dataset.rubx,1);Store.putInsta({rubrics:r});render();return}
  const go=e.target.closest("[data-goday]");if(go){S.cursor=go.dataset.goday;setView("day");return}
  const cat=e.target.closest("[data-cat]");if(cat){S.off[cat.dataset.cat]=!S.off[cat.dataset.cat];render();return}
  const pr=e.target.closest("[data-proj]");if(pr){S.activeProject=S.activeProject===pr.dataset.proj?null:pr.dataset.proj;render();return}
  if(e.target.closest("[data-editname]")){editName();return}
  if(e.target.closest("[data-team]")){S.team=!S.team;render();return}
  if(e.target.closest("[data-clr-proj]")){S.activeProject=null;render();return}
  if(e.target.closest("[data-clear-ex]")){Store.tasks.filter(t=>t.example).forEach(t=>Store.delTask(t.id));render();return}
},true);

document.getElementById("addBtn").onclick=quickAdd;
document.getElementById("fab").onclick=quickAdd;
document.getElementById("inboxBtn").onclick=()=>{S.inboxOpen=!S.inboxOpen;render()};

/* ================= голосовой ассистент ================= */
const assist=document.getElementById("assist"),aIn=document.getElementById("assistIn"),hint=document.getElementById("assistHint");
let samplePromise=null;
const getSample=()=>samplePromise||(samplePromise=window.claude?window.claude.use("sample"):Promise.resolve(null));
function showHint(t){hint.textContent=t;hint.hidden=!t}
document.getElementById("mic").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fallback=()=>{aIn.focus();showHint("Нажмите на поле и включите диктовку: на iPhone значок микрофона на клавиатуре, на Mac дважды нажмите Fn. Потом «Добавить».")};
  if(!SR)return fallback();
  try{
    const rec=new SR();rec.lang="ru-RU";rec.interimResults=true;
    const mic=document.getElementById("mic");mic.classList.add("live");showHint("Слушаю…");
    rec.onresult=ev=>{aIn.value=[...ev.results].map(r=>r[0].transcript).join(" ")};
    rec.onerror=()=>{mic.classList.remove("live");fallback()};
    rec.onend=()=>{mic.classList.remove("live");if(aIn.value.trim()){showHint("");assist.requestSubmit()}};
    rec.start();
  }catch(e){fallback()}
};
assist.onsubmit=async e=>{
  e.preventDefault();
  const text=aIn.value.trim();if(!text)return;
  const sample=await getSample();
  if(!sample){showHint("Ассистент работает, когда планер открыт в приложении Claude. Пока можно добавить задачу через «+ Задача».");return}
  const now=new Date();
  const week=[...Array(14)].map((_,i)=>{const d=addDays(now,i);return `${iso(d)} — ${WDF[(d.getDay()+6)%7]}`}).join("\n");
  const prompt=`Ты помощник личного планера. Преобразуй фразу пользователя в одну или несколько задач.
Сегодня ${iso(now)}, ${WDF[(now.getDay()+6)%7]}, сейчас ${hhmm(now.getHours()*60+now.getMinutes())}.
Ближайшие даты:
${week}
Категории: "work" (работа, встречи, созвоны, клиенты, проекты, дедлайны), "home" (быт, дом, покупки, здоровье, семья), "hobby" (хобби, спорт, прогулки, чтение, отдых), "insta" (всё для Instagram: рилсы, посты, карусели, сторис, контент-план).
Для "insta" добавь "format" ("Reels"|"Карусель"|"Пост"|"Сторис"), "status" ("idea"|"script"|"shoot"|"edit"|"ready"|"posted", по умолчанию "idea") и "rubric" — одну из рубрик: ${(Store.insta.rubrics||[]).map(r=>`"${r}"`).join(", ")||"нет"}, или null. Дата для "insta" — дата публикации.
Существующие рабочие проекты: ${Store.projects.map(p=>`"${p.name}"`).join(", ")||"нет"}. Если фраза относится к одному из них, верни его точное имя. Новый проект указывай, только если пользователь явно назвал проект.
Если день не назван, date = null (задача уйдёт во входящие). Если время не названо, time = null.
Ответь только JSON без пояснений:
{"tasks":[{"title":"коротко, с заглавной буквы","cat":"work|home|hobby","project":"имя или null","date":"YYYY-MM-DD или null","time":"HH:MM или null","dur":минуты (по умолчанию 60),"deadline":true/false,"remind":минуты до начала или null,"repeat":"none|daily|weekdays|weekly|monthly","subs":["подзадача"]}]}
Фраза: «${text}»`;
  assist.classList.add("busy");showHint("");
  try{
    const res=await sample.json(prompt,{cache:false});
    const list=(res&&Array.isArray(res.tasks))?res.tasks:[];
    if(!list.length){showHint("Не получилось разобрать фразу. Попробуйте сказать иначе, например: «завтра в 10 созвон с клиентом».");return}
    const added=[];
    list.forEach(x=>{
      let pid=null;
      if(x.project){const ex=Store.projects.find(p=>p.name.toLowerCase()===String(x.project).toLowerCase());
        if(ex)pid=ex.id;else{const np={id:uid(),name:String(x.project)};Store.putProject(np);pid=np.id}}
      const t={id:uid(),title:String(x.title||text).slice(0,200),cat:CATS[x.cat]?x.cat:"work",project:x.cat==="work"||!CATS[x.cat]?pid:null,
        date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||"")?x.date:"",time:/^\d{2}:\d{2}$/.test(x.time||"")?x.time:"",
        dur:+x.dur||60,deadline:!!x.deadline,remind:x.remind==null?null:+x.remind,repeat:REPEAT[x.repeat]?x.repeat:"none",
        subs:(x.subs||[]).map(s=>({id:uid(),text:String(s),done:false})),done:false,note:"",created:Date.now()};
      if(t.cat==="insta"){t.format=FORMATS.includes(x.format)?x.format:"Reels";t.status=STAGES.some(([k])=>k===x.status)?x.status:"idea";t.rubric=(Store.insta.rubrics||[]).includes(x.rubric)?x.rubric:"";t.done=t.status==="posted"}
      if(!t.date){t.time="";t.repeat="none"}
      Store.putTask(t);added.push(t);
    });
    aIn.value="";
    const f=added[0];
    if(f.date&&S.view!=="month")S.cursor=f.date;
    render();
    const when=f.date?`${parse(f.date).getDate()} ${MONTHS[parse(f.date).getMonth()]}${f.time?", "+f.time:""}`:"во входящие";
    toast(added.length>1?`Добавлено задач: ${added.length}`:f.title,added.length>1?added.map(a=>a.title).join(" · "):when,
      {label:"Отменить",run:()=>{added.forEach(a=>Store.delTask(a.id));render()}});
  }catch(err){
    showHint(err&&err.code==="not_granted"?"Ассистенту нужен доступ. Разрешите его при следующей попытке.":err&&err.code==="rate_limited"?"Слишком много запросов подряд. Подождите минуту.":"Не получилось связаться с ассистентом. Попробуйте ещё раз.");
  }finally{assist.classList.remove("busy")}
};

/* ================= приветствие ================= */
let editingName=false;
function renderHello(){
  if(editingName)return;
  const h=document.getElementById("hello"),n=Store.displayName();
  h.innerHTML=n?`Hello, <span class="nm" data-editname title="Изменить имя">${esc(n)}</span>`:`Hello<button class="ask" data-editname>Как вас зовут?</button>`;
}
function editName(){
  editingName=true;
  const h=document.getElementById("hello");
  h.innerHTML=`Hello, <input id="nameIn" aria-label="Ваше имя" placeholder="Имя" value="${esc(Store.displayName())}">`;
  const i=document.getElementById("nameIn");i.focus();i.select();
  const done=save=>{if(!editingName)return;editingName=false;const v=i.value.trim();if(save&&v)Store.setName(v);renderHello()};
  i.onkeydown=e=>{if(e.key==="Enter")done(true);if(e.key==="Escape")done(false)};
  i.onblur=()=>done(true);
}

/* ================= часы ================= */
const openedAt=new Date();
function tick(){const n=new Date();
  document.getElementById("clockNow").textContent=hhmm(n.getHours()*60+n.getMinutes());
  document.getElementById("clockSince").textContent="открыт в "+hhmm(openedAt.getHours()*60+openedAt.getMinutes());}
tick();setInterval(tick,10000);

/* ================= старт ================= */
render();renderHello();
Store.init().then(()=>{render();renderHello()});
checkReminders();
setInterval(()=>{checkReminders();if(S.view==="day"&&!document.getElementById("modalSlot").innerHTML)render()},30000);
})();
</script>
